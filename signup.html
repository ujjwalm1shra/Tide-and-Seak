<form class="field-group" id="signup-form">

    <div>
        <label for="s-email">Email</label>
        <input
            type="email"
            id="s-email"
            name="email"
            autocomplete="email"
            required
        >
    </div>

    <div>
        <label for="s-password">Password</label>
        <input
            type="password"
            id="s-password"
            name="password"
            autocomplete="new-password"
            required
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Create Account <span class="arrow">→</span>
    </button>

</form>
